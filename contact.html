<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>お問い合わせ ｜ 株式会社はなひろ</title>
  <meta name="description" content="株式会社はなひろへのお問い合わせフォーム。見学・体験・資料請求のお申し込みを受け付けています。">
  <meta property="og:title" content="お問い合わせ ｜ 株式会社はなひろ">
  <meta property="og:description" content="見学・体験・資料請求のお申し込みフォーム。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://info.hana-hiro.com/contact.html">
  <meta property="og:site_name" content="株式会社はなひろ">
  <meta property="og:image" content="https://info.hana-hiro.com/photos/ogp.jpg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/photos/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/photos/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/photos/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #1f2933;
      --ink-soft: #3a414d;
      --ink-mute: #5d6068;
      --gold: #a87827;
      --gold-soft: #d6b072;
      --gold-pale: #f4ead6;
      --paper: #fbf9f4;
      --line: #e3dccc;
      --line-soft: #f0eadb;
      --error: #b54040;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.85;
      font-size: 15px;
      padding: 0 0 80px;
    }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
    }
    .topbar .crumb {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.15em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }
    .topbar a {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 22px;
      transition: all 0.2s;
    }
    .topbar a:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
    .container { max-width: 720px; margin: 0 auto; padding: 56px 24px; }
    .doc-head { text-align: center; padding: 0 0 40px; }
    .doc-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12pt;
      letter-spacing: 0.4em;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .doc-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 32px;
      letter-spacing: 0.06em;
      color: var(--ink);
      font-weight: 600;
    }
    .doc-divider {
      width: 60px; height: 1px;
      background: var(--gold);
      margin: 24px auto 0;
    }

    .lead {
      font-size: 14px;
      color: var(--ink-soft);
      text-align: center;
      line-height: 1.95;
      margin-bottom: 36px;
      letter-spacing: 0.04em;
    }

    .form-card {
      background: #fff;
      border: 1px solid var(--line);
      padding: 36px 32px;
    }
    .form-row { margin-bottom: 22px; }
    .form-row label.lab {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .req {
      font-size: 10px;
      background: var(--ink);
      color: #fff;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 0.1em;
      font-weight: 500;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .opt {
      font-size: 10px;
      background: transparent;
      color: var(--ink-mute);
      border: 1px solid var(--line);
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 0.1em;
      font-weight: 500;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .form-row input[type="text"],
    .form-row input[type="email"],
    .form-row input[type="tel"],
    .form-row textarea,
    .form-row select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      transition: border-color 0.2s, background 0.2s;
    }
    .form-row input:focus,
    .form-row textarea:focus,
    .form-row select:focus {
      outline: none;
      border-color: var(--gold);
      background: #fff;
    }
    .form-row textarea { resize: vertical; min-height: 140px; line-height: 1.7; }

    .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-group label {
      cursor: pointer;
      padding: 9px 16px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 13px;
      letter-spacing: 0.04em;
      transition: all 0.15s;
      user-select: none;
    }
    .radio-group input[type="radio"] { display: none; }
    .radio-group label:hover { border-color: var(--gold-soft); }
    .radio-group input[type="radio"]:checked + span,
    .radio-group label.selected {
      background: var(--ink); color: #fff; border-color: var(--ink);
    }

    /* honeypot (visually hidden, kept tab-able-out for accessibility) */
    .hp-field {
      position: absolute !important;
      left: -9999px !important;
      width: 1px; height: 1px; opacity: 0;
    }

    .submit-row { margin-top: 32px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--ink);
      color: #fff;
      border: none;
      font-size: 15px;
      letter-spacing: 0.2em;
      font-family: 'Noto Serif JP', serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .submit-btn:hover { background: var(--gold); }
    .submit-btn:active { transform: translateY(1px); }
    .submit-btn:disabled { background: var(--ink-mute); cursor: not-allowed; }

    .help {
      font-size: 12px;
      color: var(--ink-mute);
      margin-top: 6px;
      line-height: 1.6;
    }
    .form-error {
      background: #fdf0f0;
      border: 1px solid var(--error);
      color: var(--error);
      padding: 14px 18px;
      font-size: 13px;
      margin-bottom: 24px;
      display: none;
    }
    .form-error.show { display: block; }

    .success-card {
      background: #fff;
      border: 1px solid var(--gold-soft);
      padding: 56px 32px;
      text-align: center;
      display: none;
    }
    .success-card.show { display: block; }
    .success-icon {
      width: 64px; height: 64px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .success-icon::after {
      content: "";
      width: 24px; height: 12px;
      border-left: 2px solid var(--gold);
      border-bottom: 2px solid var(--gold);
      transform: rotate(-45deg) translate(2px, -2px);
    }
    .success-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 14px;
      letter-spacing: 0.06em;
    }
    .success-text {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.95;
      margin-bottom: 28px;
    }
    .success-back {
      display: inline-block;
      padding: 12px 32px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.15em;
      transition: background 0.2s;
    }
    .success-back:hover { background: var(--gold); }

    .alt-contact {
      margin-top: 36px;
      padding: 24px;
      background: #fff;
      border: 1px solid var(--line);
      text-align: center;
    }
    .alt-contact-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .alt-contact-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }
    .alt-contact-tel {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 8px;
    }
    .alt-contact-tel:hover { color: var(--gold); }
    .alt-contact-charge { font-size: 12px; color: var(--ink-mute); }

    .doc-footer {
      text-align: center;
      margin-top: 56px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-mute);
      letter-spacing: 0.1em;
    }

    @media (max-width: 600px) {
      .container { padding: 36px 18px; }
      .doc-title { font-size: 26px; }
      .form-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="https://www.hana-hiro.com/">&#x2190; ホームへ</a>
    <span class="crumb">Contact</span>
    <span></span>
  </div>

  <div class="container">
    <div class="doc-head">
      <div class="doc-eyebrow">CONTACT</div>
      <h1 class="doc-title">お問い合わせ</h1>
      <div class="doc-divider"></div>
    </div>

    <p class="lead">
      見学・無料体験・資料請求のお申し込み、その他のご相談を承っております。<br>
      下記フォームよりお気軽にお問い合わせください。<br>
      内容を確認次第、担当者よりご連絡いたします。
    </p>

    <form id="contactForm" class="form-card" novalidate>
      <div id="formError" class="form-error"></div>

      <div class="form-row">
        <label class="lab" for="name">お名前 <span class="req">必須</span></label>
        <input type="text" id="name" name="name" required maxlength="100" autocomplete="name">
      </div>

      <div class="form-row">
        <label class="lab">ご関係 <span class="opt">任意</span></label>
        <div class="radio-group" data-name="relationship">
          <label><input type="radio" name="relationship" value="本人"><span>本人</span></label>
          <label><input type="radio" name="relationship" value="ご家族"><span>ご家族</span></label>
          <label><input type="radio" name="relationship" value="ケアマネジャー"><span>ケアマネジャー</span></label>
          <label><input type="radio" name="relationship" value="医療・介護関係者"><span>医療・介護関係者</span></label>
          <label><input type="radio" name="relationship" value="その他"><span>その他</span></label>
        </div>
      </div>

      <div class="form-row">
        <label class="lab">お問い合わせ種別 <span class="opt">任意</span></label>
        <div class="radio-group" data-name="inquiryType">
          <label><input type="radio" name="inquiryType" value="見学希望"><span>見学希望</span></label>
          <label><input type="radio" name="inquiryType" value="体験希望"><span>体験希望</span></label>
          <label><input type="radio" name="inquiryType" value="資料請求"><span>資料請求</span></label>
          <label><input type="radio" name="inquiryType" value="採用について"><span>採用について</span></label>
          <label><input type="radio" name="inquiryType" value="その他"><span>その他</span></label>
        </div>
      </div>

      <div class="form-row">
        <label class="lab" for="phone">電話番号 <span class="opt">任意</span></label>
        <input type="tel" id="phone" name="phone" maxlength="50" autocomplete="tel">
        <div class="help">お電話でのご連絡をご希望の場合はご記入ください。</div>
      </div>

      <div class="form-row">
        <label class="lab" for="email">メールアドレス <span class="req">必須</span></label>
        <input type="email" id="email" name="email" required maxlength="200" autocomplete="email">
      </div>

      <div class="form-row">
        <label class="lab" for="message">お問い合わせ内容 <span class="req">必須</span></label>
        <textarea id="message" name="message" required maxlength="5000" placeholder="ご見学希望日、ご質問、その他お困りのことなど、お気軽にお書きください。"></textarea>
      </div>

      <!-- honeypot -->
      <div class="hp-field" aria-hidden="true">
        <label>このフィールドは入力しないでください<input type="text" name="_hp" tabindex="-1" autocomplete="off"></label>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit-btn" id="submitBtn">送 信 す る</button>
      </div>
    </form>

    <div id="successCard" class="success-card">
      <div class="success-icon"></div>
      <div class="success-title">お問い合わせありがとうございます</div>
      <div class="success-text">
        担当者より2営業日以内にご連絡いたします。<br>
        お急ぎの場合はお電話でお問い合わせください。
      </div>
      <a href="/company.html" class="success-back">会社概要を見る</a>
    </div>

    <div class="alt-contact">
      <div class="alt-contact-eyebrow">PHONE</div>
      <div class="alt-contact-title">お電話でのお問い合わせ</div>
      <a href="tel:080-2848-2881" class="alt-contact-tel">080-2848-2881</a>
      <div class="alt-contact-charge">開設準備室／担当：豊嶋</div>
    </div>

    <div class="doc-footer">
      &copy; 株式会社はなひろ
    </div>
  </div>

  <script>
    // ラジオの見た目切り替え
    document.querySelectorAll('.radio-group').forEach(group => {
      group.addEventListener('change', e => {
        if (e.target.matches('input[type="radio"]')) {
          group.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
          e.target.closest('label').classList.add('selected');
        }
      });
    });

    const formStartTs = Date.now();
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const formError = document.getElementById('formError');
    const successCard = document.getElementById('successCard');

    const ENDPOINT = 'https://www.event-manager.app/api/contact-info';

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.add('show');
      formError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function hideError() { formError.classList.remove('show'); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const fd = new FormData(form);
      const payload = {
        name: (fd.get('name') || '').trim(),
        phone: (fd.get('phone') || '').trim(),
        email: (fd.get('email') || '').trim(),
        relationship: fd.get('relationship') || '',
        inquiryType: fd.get('inquiryType') || '',
        message: (fd.get('message') || '').trim(),
        source: location.href,
        _hp: fd.get('_hp') || '',
        _ts: formStartTs,
      };

      // クライアント側バリデーション
      if (!payload.name) return showError('お名前を入力してください');
      if (!payload.email) return showError('メールアドレスを入力してください');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) return showError('メールアドレスの形式を確認してください');
      if (!payload.message) return showError('お問い合わせ内容を入力してください');

      submitBtn.disabled = true;
      submitBtn.textContent = '送 信 中 …';

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || '送信に失敗しました。お時間をおいて再度お試しください。');
          submitBtn.disabled = false;
          submitBtn.textContent = '送 信 す る';
          return;
        }
        form.style.display = 'none';
        successCard.classList.add('show');
        successCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        console.error(err);
        showError('通信エラーが発生しました。インターネット接続をご確認の上、再度お試しください。');
        submitBtn.disabled = false;
        submitBtn.textContent = '送 信 す る';
      }
    });
  </script>
</body>
</html>
